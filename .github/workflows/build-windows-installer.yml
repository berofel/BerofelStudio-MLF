name: Build Windows installer

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Windows 11 / Python 3.12 tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-core.txt

      - name: Install editor dependencies and test runner
        run: python -m pip install --disable-pip-version-check -r requirements-core.txt pytest

      - name: Run regression suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install NSIS
        shell: powershell
        run: choco install nsis --yes --no-progress

      - name: Compile one-file bootstrap installer
        shell: powershell
        run: |
          $expected = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          .\scripts\build_windows_installer.ps1 -CompilerPath 'C:\Program Files (x86)\NSIS\makensis.exe' -ExpectedVersion $expected

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BerofelStudio-Windows-x64
          path: |
            dist/BerofelStudio-Setup-x64.exe
            dist/BerofelStudio-Setup-x64.exe.sha256
            dist/BerofelStudio-*-Setup-x64.exe
            dist/BerofelStudio-*-Setup-x64.exe.sha256
          if-no-files-found: error
          retention-days: 30


  installer-smoke:
    name: Clean Windows install / launch / uninstall
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/fix/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: BerofelStudio-Windows-x64
          path: dist

      - name: Install core-only package on clean Windows
        shell: powershell
        run: |
          $installer = Get-ChildItem dist -Filter 'BerofelStudio-*-Setup-x64.exe' | Where-Object { $_.Name -ne 'BerofelStudio-Setup-x64.exe' } | Select-Object -First 1
          if (-not $installer) { throw 'O instalador versionado não veio no artefato.' }
          $shaFile = $installer.FullName + '.sha256'
          if (-not (Test-Path -LiteralPath $shaFile)) { throw 'Checksum SHA-256 ausente.' }
          $expected = [regex]::Match((Get-Content -LiteralPath $shaFile -Raw), '(?i)\b[a-f0-9]{64}\b').Value
          if (-not $expected) { throw 'Checksum SHA-256 inválido.' }
          $actual = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash
          if ($actual -ine $expected) { throw 'O EXE do instalador diverge do SHA-256.' }
          $installRoot = Join-Path $env:LOCALAPPDATA 'BerofelStudio'
          if (Test-Path -LiteralPath $installRoot) { throw 'Runner de smoke não está limpo: instalação anterior detectada.' }
          & $installer.FullName /S /NOUPDATECHECK /COREONLY
          if ($LASTEXITCODE -ne 0) { throw "Setup silencioso falhou com código $LASTEXITCODE." }
          $python = Join-Path $env:LOCALAPPDATA 'BFS\venv\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python)) { throw 'O bootstrap não criou o ambiente Python.' }
          $env:BEROFEL_APP_ROOT = $installRoot
          & $python (Join-Path $installRoot 'scripts\verificar.py') --strict --quick --editor-only
          if ($LASTEXITCODE -ne 0) { throw 'O diagnóstico do editor instalado falhou.' }
          & $python (Join-Path $installRoot 'scripts\smoke_installed_app.py')
          if ($LASTEXITCODE -ne 0) { throw 'A janela principal não abriu no ambiente instalado.' }
          $desktopLink = Join-Path $env:USERPROFILE 'Desktop\BerofelStudio.lnk'
          if (-not (Test-Path -LiteralPath $desktopLink)) { throw 'O atalho da Área de Trabalho não foi criado.' }
          $marker = Join-Path $env:LOCALAPPDATA 'BFS\installer-smoke-sentinel.txt'
          Set-Content -LiteralPath $marker -Encoding ascii -Value 'keep-user-data'
          $uninstaller = Join-Path $installRoot 'Uninstall.exe'
          if (-not (Test-Path -LiteralPath $uninstaller)) { throw 'O desinstalador não foi instalado.' }
          & $uninstaller /S
          if ($LASTEXITCODE -ne 0) { throw "Desinstalação silenciosa falhou com código $LASTEXITCODE." }
          if (-not (Test-Path -LiteralPath $marker)) { throw 'Desinstalar removeu dados de usuário fora da pasta do app.' }
          Remove-Item -LiteralPath $marker -Force
          if (Test-Path -LiteralPath $installRoot) { throw 'A pasta do aplicativo permaneceu após a desinstalação.' }
          if (Test-Path -LiteralPath $desktopLink) { throw 'O atalho não foi removido na desinstalação.' }
          Write-Host '[OK] Instalação limpa, diagnóstico, janela Qt, atalho, preservação de dados e desinstalação.'

  publish-release:
    name: Publish validated GitHub Release
    needs: installer-smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download validated installer artifact
        uses: actions/download-artifact@v4
        with:
          name: BerofelStudio-Windows-x64
          path: dist
      - name: Publish assets only after clean-install smoke passes
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $versioned = Join-Path $PWD "dist\BerofelStudio-$version-Setup-x64.exe"
          $versionedSum = "$versioned.sha256"
          $stable = Join-Path $PWD 'dist\BerofelStudio-Setup-x64.exe'
          $stableSum = "$stable.sha256"
          foreach ($asset in @($versioned,$versionedSum,$stable,$stableSum)) {
            if (-not (Test-Path -LiteralPath $asset)) { throw "Asset de release ausente: $asset" }
          }
          $versionInSource = (Select-String -Path 'berofel\__init__.py' -Pattern "__version__\s*=\s*'([^']+)'" -AllMatches).Matches[0].Groups[1].Value
          if ($versionInSource -cne $version) { throw "Tag $version diverge da versão do código $versionInSource" }
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível buscar main para validar a origem da tag.' }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Uma Release pública só pode vir de um commit validado e integrado em main.' }
          if ($version -match '-(alpha|beta|rc)(\.|-)') {
            gh release create $env:GITHUB_REF_NAME $versioned $versionedSum $stable $stableSum --verify-tag --prerelease --latest=false --title "BerofelStudio $env:GITHUB_REF_NAME" --generate-notes
          } else {
            gh release create $env:GITHUB_REF_NAME $versioned $versionedSum $stable $stableSum --verify-tag --latest --title "BerofelStudio $env:GITHUB_REF_NAME" --generate-notes
          }
