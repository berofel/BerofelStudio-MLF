name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Inno Setup 6
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Compile one-file bootstrap installer
        shell: powershell
        run: .\scripts\build_windows_installer.ps1 -CompilerPath 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BerofelStudio-Windows-x64
          path: |
            dist/BerofelStudio-*-Setup-x64.exe
            dist/BerofelStudio-*-Setup-x64.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish installer on GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem dist -Filter 'BerofelStudio-*-Setup-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer não encontrado em dist.' }
          gh release create $env:GITHUB_REF_NAME $installer.FullName ($installer.FullName + '.sha256') --verify-tag --title "BerofelStudio $env:GITHUB_REF_NAME" --generate-notes
